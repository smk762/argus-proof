# argus-iris GPU tenant manifest for argus-proof (#79).
# Validated by argus-cortex's TenantManifest (gpu-tenant-schema.json, tenant_version 1.0); tests/test_gpu.py fails if
# it stops validating or drifts from the figures in src/argus_proof/gpu.py.
#
# With ARGUS_GPU_COORDINATOR=broker, proof registers this with the broker on its first lease
# (ARGUS_GPU_TENANT_MANIFEST points at it; the Docker image ships it at /app/gpu-tenant.yaml). Tokens never go here:
# ARGUS_GPU_BROKER_TOKEN lives in the host's .env.
#
# VRAM figures are MiB. The broker uses its learned p95 per kind when that is larger, so a heavier checkpoint (Flux)
# is caught after a few leases.
#
# An evaluation grid is batch work and yields between seeds: one lease covers a run, and when the broker asks for the
# GPU back proof releases it at the next seed and queues again on the same node. Scoring a run is one short,
# non-preemptible `score` lease (interactive; batch when it is part of a /run/stream run).
tenant: argus-proof
description: Post-training LoRA evaluation. Renders a seed grid from a trained LoRA and scores it.
repo: smk762/argus-proof

kinds:
  # A run's seed grid, rendered by ComfyUI (PROOF_BACKEND=comfyui, the default).
  - kind: generate
    target: comfyui
    vram_mb: 9000
    model_mb: 6500 # the SDXL checkpoint, which stays loaded in ComfyUI
    priority: batch
    preemptible: true
    description: An evaluation grid rendered by ComfyUI, one seed at a time.

  # A run's seed grid, rendered in proof's own process (PROOF_BACKEND=diffusers).
  - kind: generate-local
    target: in-process
    vram_mb: 10000
    model_mb: 7000 # the fp16 SDXL pipeline, kept loaded between runs with the same models
    priority: batch
    preemptible: true
    description: An evaluation grid rendered in-process by diffusers, one seed at a time.

  # One scoring pass over a run's images with the learned scorers, in proof's own process: InsightFace (onnxruntime),
  # DINOv2 likeness and CLIP-IQA (torch, CUDA), CLIPScore (torch, CPU). Safety is a separate NudeNet service.
  # vram_mb is measured plus an estimate: on an RTX 3090 the torch scorers peaked at 1399 MiB over the idle device
  # (CUDA context included; four 1024x1024 images scored one at a time). InsightFace buffalo_l on CUDA couldn't be
  # measured there (the local -score image's onnxruntime-gpu found no CUDA 12 libraries), so 1500 MiB is budgeted
  # for it (its five ONNX models, about 330 MB on disk, plus the CUDA EP context, cuDNN workspace and arena at
  # det_size 640), and the sum is rounded up for headroom. The broker's learned p95 corrects it either way.
  # model_mb 0: the scorers free their models before the lease ends, so nothing stays loaded.
  - kind: score
    target: in-process
    vram_mb: 3500
    model_mb: 0
    priority: interactive
    preemptible: false
    description: One scoring pass (identity, likeness, quality) over a run's images, in proof's process.

  # A speech grid (#118): every prompt in every held-out reference voice at every seed, generated by argus-echo's
  # XTTS-v2 or Qwen3-TTS engine, one utterance at a time. Echo is a resident and keeps its weights loaded (declared in
  # echo's own manifest); proof only asks it to speak. Targets are iris's names for the engines: `xtts`, and `tts` for
  # Qwen3-TTS. Figures are echo's: XTTS-v2 about 2 GB loaded, Qwen3-TTS 4800 MiB (the 1.7B model, echo#27; echo#6
  # has the measurement). model_mb is the loaded weights without the working set, estimated.
  - kind: speak-xtts
    target: xtts
    vram_mb: 2000
    model_mb: 1800
    priority: batch
    preemptible: true
    description: A speech evaluation grid spoken by argus-echo's XTTS-v2 engine, one utterance at a time.

  - kind: speak-qwen
    target: tts
    vram_mb: 4800
    model_mb: 4300
    priority: batch
    preemptible: true
    description: A speech evaluation grid spoken by argus-echo's Qwen3-TTS engine, one utterance at a time.

# Proof keeps no model loaded on its own server: ComfyUI holds the weights and declares them in its own manifest. The
# diffusers pipeline lives only as long as the CLI or server process that ran it, and has no unload route. The scorers
# load inside their `score` lease and free their models before it ends.
residents: []
