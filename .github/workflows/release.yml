name: Release to PyPI

# Top-level (non-reusable) on purpose: PyPI trusted publishing cannot run inside
# a reusable workflow. Keep this file in sync across the suite via `copier update`.

on:
  push:
    tags: ["v*"]
  # Sent by argus-cortex's release workflow. The image installs argus-cortex
  # from the pyproject range at build time, so rebuilding the newest release's
  # image is how a new cortex reaches it. Only the image jobs run: PyPI and the
  # GitHub Release for that tag already exist.
  repository_dispatch:
    types: [cortex-released]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    # Not on a cortex dispatch, so the PyPI and Release jobs that chain off it
    # skip too.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-install:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install wheel and smoke-test import
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install dist/*.whl
          uv run --no-sync python -c "import argus_proof; print(f'argus-proof {argus_proof.__version__} OK')"

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: test-install
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    runs-on: ubuntu-latest
    # Ordered *after* the TestPyPI rehearsal so its outcome is visible first, but
    # deliberately not gated on it. A TestPyPI-only fault — a missing trusted
    # publisher, an index outage — must not silently withhold the real release:
    # that failure mode shipped argus-proof images for two tags with no wheel on
    # PyPI, and nothing surfaced it because publish-image is independent.
    # Only the build + install gate is required; a TestPyPI failure still marks
    # the whole run failed, so the problem stays loud.
    needs: [test-install, publish-testpypi]
    if: "!cancelled() && needs.test-install.result == 'success'"
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-tag:
    # The tag the image jobs build: the pushed one, or on a cortex dispatch the
    # newest final release. A pre-release never moved `latest`, so a dispatch
    # does not rebuild one.
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'repository_dispatch'
      - id: tag
        env:
          CORTEX_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != repository_dispatch ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          refs=$(git ls-remote --tags origin 'refs/tags/v*')
          tag=$(echo "$refs" | sed -n 's|.*refs/tags/\(v[0-9]*\.[0-9]*\.[0-9]*\)\(\^{}\)\{0,1\}$|\1|p' | sort -uV | tail -n1)
          if [ -z "$tag" ]; then
            echo "::notice::No release tag yet, so no image to rebuild for cortex $CORTEX_VERSION."
            exit 0
          fi
          # An annotated tag lists its commit on the peeled ^{} line.
          sha=$(echo "$refs" | awk -v t="refs/tags/$tag" '$2 == t {l = $1} $2 == t "^{}" {p = $1} END {print p ? p : l}')
          echo "Rebuilding $tag ($sha) for cortex $CORTEX_VERSION."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish-image:
    runs-on: ubuntu-latest
    needs: [release-tag, test-install]
    # On a cortex dispatch test-install is skipped (nothing was built for PyPI),
    # so the job runs on the tag alone.
    if: "!cancelled() && needs.release-tag.outputs.tag != '' && (needs.test-install.result == 'success' || github.event_name == 'repository_dispatch')"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
          fetch-depth: 0 # hatch-vcs reads the tag from git history
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus-proof
          labels: org.opencontainers.image.revision=${{ needs.release-tag.outputs.sha }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-tag.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A dispatch rebuilds an unchanged context, so a cached install layer
          # would keep the old argus-cortex.
          no-cache: ${{ github.event_name == 'repository_dispatch' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    # The GitHub Release is the last step, so it only appears once the version is
    # actually on PyPI. Its notes are this version's CHANGELOG.md section.
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [${version}]" 'index($0, head) == 1 {found = 1; next} found && /^## \[/ {exit} found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in *-*|*rc*|*a[0-9]*|*b[0-9]*) prerelease="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run of the workflow: refresh notes and assets rather than failing.
            gh release edit "$tag" --notes-file notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "$tag" --notes-file notes.md $prerelease
          fi
