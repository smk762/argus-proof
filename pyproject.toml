[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-proof"
dynamic = ["version"]
description = "Post-training LoRA evaluation and optimisation: generate samples from a trained LoRA and score them against the curated dataset it was trained from"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    # Shared suite foundation (taxonomy, wire-schema tooling, AI-backend contract,
    # and the server write-guard scaffolding used by server/app.py — 0.2.0+).
    # 0.4+: argus_cortex.moderation (the NudeNet client the safety scorer uses).
    # 0.6+: argus_cortex.gpu_broker (argus-iris leases; [remote] = httpx, [yaml] = the tenant manifest).
    # Capped below the next minor: argus-cortex is pre-1.0, where a minor bump
    # carries no compatibility guarantee.
    "argus-cortex[remote,yaml]>=0.9,<0.10",
    "pydantic>=2.7",
    "structlog>=24.0",
]

[project.optional-dependencies]
# argus-cortex[server] pulls starlette for the shared write-guard (argus_cortex.server);
# fastapi provides it too, but the extra declares the dependency honestly.
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.7", "argus-cortex[server]>=0.9,<0.10"]
cli = ["typer>=0.12", "rich>=13.0"]
# Concrete scorers (implement argus_proof.scoring protocols): dedup/diversity
# (phash) + identity (InsightFace ArcFace) + likeness (DINOv2 via transformers,
# which CLIPScore and pyiqa already pull; declared here because likeness imports it)
# + quality (CLIPScore/pyiqa).
# CI's dev extra pulls only the light deps; the heavy ones (insightface, torch…)
# stay opt-in — their scorers report is_available()=False without them, and CI's
# score-imports job checks the resolved set actually imports.
# pyiqa 0.1.16 is the first that imports on numpy 2 with a current timm (#98).
score = [
    "pillow>=10.0",
    "imagehash>=4.3",
    "insightface>=0.7",
    "onnxruntime>=1.16",
    "torch>=2.0",
    "torchmetrics>=1.0",
    "transformers>=4.38",
    "pyiqa>=0.1.16",
]
# ImageReward (the `preference` metric). Not in default_scorers(), and it pins
# timm==0.6.13, which pyiqa>=0.1.16 can't share, so it can't be installed next to
# [score]: use it in its own environment via image_reward_scorer().
preference = ["image-reward>=1.5", "pillow>=10.0"]
# Cross-run stats store (pass-rate CIs use the dependency-free argus_proof.stats;
# the parquet store needs polars, inter-rater reliability the krippendorff pkg).
# Lightweight — pulled into dev so CI tests it.
stats = ["polars>=1.0", "krippendorff>=0.6"]
# Guided A/B search: sample-efficient exploration of an ExperimentMatrix when
# the full cartesian is too large to brute-force. Lazy-imported by
# argus_proof.experiment.optuna_search; absent -> that function raises a hint.
opt = ["optuna>=3.0"]
# Optional FiftyOne exploration surface (issue #14): open a scored run as a
# FiftyOne dataset for embedding viz + tag triage. Heavy + power-user-only, so
# NOT in dev — argus_proof.explore lazy-imports it and is_available()-guards.
fiftyone = ["fiftyone>=0.23", "umap-learn>=0.5"]  # umap-learn powers the --umap brain visualisation
# In-process diffusers generation backend (issue #13). Heavy (torch), so opt-in;
# the a1111/remote backends need no extra (stdlib HTTP). Lazy-imported by
# argus_proof.backends.diffusers; absent -> a clear install hint.
diffusers = ["diffusers>=0.27", "torch>=2.0", "transformers>=4.38", "accelerate>=0.27", "safetensors>=0.4", "pillow>=10.0"]
# Guard-class policy-taxonomy moderation (issue #41): Llama Guard 3 Vision over
# outputs + input prompts. LLM-weight, so opt-in; lazy-imported by
# argus_proof.moderation and is_available()-guarded (absent -> a clear hint).
# transformers 4.45 added MllamaForConditionalGeneration (Llama Guard 3 Vision).
moderation = ["transformers>=4.45", "torch>=2.0", "accelerate>=0.27", "pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.15.16", "httpx>=0.27", "certifi>=2026.10.19", "pillow>=10.0", "imagehash>=4.3", "polars>=1.0", "krippendorff>=0.6", "optuna>=3.0", "httpx2>=2.7"]

[project.scripts]
argus-proof = "argus_proof.cli:app"

[project.urls]
Repository = "https://github.com/smk762/argus-proof"

[tool.uv]
# image-reward pins timm==0.6.13; pyiqa>=0.1.16 needs timm>=0.8 (#98).
conflicts = [[{ extra = "score" }, { extra = "preference" }]]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_proof/_version.py"

# The hosted demo (web/, ~20 MiB of WebP) and its tape builder are not part of the package.
[tool.hatch.build.targets.sdist]
exclude = ["web/", "scripts/demo_tape.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/argus_proof"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/argus_proof/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
